# Optional overlay for a separately deployed self-hosted Langfuse instance.
# Create the external network first and attach the Langfuse web service to it.
services:
  backend:
    networks:
      - hugagent-network
      - langfuse-observability

networks:
  langfuse-observability:
    external: true
    name: ${LANGFUSE_DOCKER_NETWORK:-langfuse-observability}
