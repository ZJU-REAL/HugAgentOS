user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # ── 传输压缩 ───────────────────────────────────────────────────────────────
    # 优先送构建时生成的预压缩文件（scripts/precompress-dist.mjs 产出的同名 .gz），
    # 没有预压缩副本时（比如后端反代回来的 API JSON）再实时压。
    #
    # 为什么必须显式写 gzip_comp_level：nginx 的默认值是 1，压缩率差得离谱 —— 实测主入口
    # JS 实时压出来 1782KB，离线 gzip -9 只要 1563KB；主 CSS 是 120KB vs 86KB。首屏光这
    # 两个文件就白传 250KB，在出口带宽只有几 Mbps 的部署环境里是接近一秒的差距。
    # 静态资源走 gzip_static 拿满级压缩，实时压缩这条路只服务 API，用 6 平衡 CPU 与体积。
    gzip_static on;
    gzip on;
    gzip_comp_level 6;
    gzip_vary on;
    # 小响应压了不划算：省下的字节还不够一个包，反而多花 CPU 和一个 Vary 头。
    gzip_min_length 1024;
    # 默认 gzip_proxied off 意味着带 Via 头的请求不压。浏览器直连没有 Via 所以现在看着
    # 正常，但一旦前面挂了 CDN/网关，API 响应就会悄悄退化成不压缩。
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml application/xml+rss
        application/manifest+json application/wasm
        image/svg+xml;
    # 注意：woff/woff2/png/jpg/webp 本身已是压缩格式，不要加进来 —— 再压一遍只会更大。

    # 解决 414 Request-URI Too Large（cookie/token 较长时触发）
    large_client_header_buffers 4 32k;
    client_header_buffer_size 16k;

    # Server block is rendered from template at container startup
    include /etc/nginx/conf.d/*.conf;
}
