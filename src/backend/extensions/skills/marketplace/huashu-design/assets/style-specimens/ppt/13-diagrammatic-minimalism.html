<div class="t">菜市场改造 · 方法论</div>
<h1>好的菜市场，是从圆心向外长出来的</h1>
<div class="txt">多数改造从最外圈开始：翻新摊位、统一招牌。我们倒着来——先问<b>为什么</b>这里需要一个市场，再决定怎么运营，最后才是它长什么样。</div>
<div class="cmp"><span>案例对照</span><br>东风路市场按外圈改造，两年后空置率 31%；槐树巷市场从圆心出发，空置率 4%。</div>
<svg width="640" height="690" viewBox="0 0 640 690">
<circle cx="320" cy="345" r="300" fill="#fff" stroke="#111" stroke-width="3"/>
<circle cx="320" cy="400" r="200" fill="#EDEBE6" stroke="#111" stroke-width="3"/>
<circle cx="320" cy="455" r="100" fill="#E4572E" stroke="#111" stroke-width="3"/>
<text x="320" y="82" text-anchor="middle" font-size="26" font-weight="700" letter-spacing="3">WHAT · 摊位与空间</text>
<text x="320" y="116" text-anchor="middle" font-size="16" fill="#555">看得见的东西：招牌、动线、冷链</text>
<text x="320" y="268" text-anchor="middle" font-size="26" font-weight="700" letter-spacing="3">HOW · 运营方式</text>
<text x="320" y="300" text-anchor="middle" font-size="16" fill="#555">租金、营业时间、摊主组合</text>
<text x="320" y="452" text-anchor="middle" font-size="32" font-weight="700" fill="#fff" letter-spacing="3">WHY</text>
<text x="320" y="484" text-anchor="middle" font-size="16" fill="#fff">邻里的日常饭桌</text>
