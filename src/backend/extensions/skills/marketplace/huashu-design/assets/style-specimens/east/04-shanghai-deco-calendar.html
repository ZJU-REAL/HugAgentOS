<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>04 上海摩登装饰艺术</title>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&family=Noto+Serif+SC:wght@600;900&family=Noto+Sans+SC:wght@500;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1200px;height:750px;overflow:hidden;background:#17352F}
body{position:relative;font-family:"Noto Sans SC",sans-serif;color:#F2E3BE}
.card{position:absolute;left:50px;top:30px;width:1100px;height:690px;background:#EBD9AE;border:6px solid #C9A24A;box-sizing:border-box}
.card:before{content:"";position:absolute;inset:8px;border:2px solid #17352F}
/* 左：几何太阳扇 */
.art{position:absolute;left:40px;top:40px;width:560px;height:600px;background:#17352F;overflow:hidden}
.title{position:absolute;right:50px;top:50px;width:430px}
.title .y{font:400 20px "Noto Sans SC";letter-spacing:.5em;color:#17352F;margin-left:6px;font-weight:700}
.title h1{margin:6px 0 0;font:400 92px/1.0 "ZCOOL XiaoWei";color:#9E2A1D;letter-spacing:.04em;text-shadow:5px 5px 0 #C9A24A}
.title p{margin:16px 0 0;font:600 20px/1.7 "Noto Serif SC";color:#17352F;letter-spacing:.1em}
.cal{position:absolute;right:50px;bottom:50px;width:430px;background:#17352F;padding:16px 18px;box-sizing:border-box;color:#EBD9AE}
.cal .m{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid #C9A24A;padding-bottom:8px;margin-bottom:8px}
.cal .m b{font:400 44px/1 "ZCOOL XiaoWei";color:#E6BE5B;letter-spacing:.08em}
.cal .m span{font:700 14px "Noto Sans SC";letter-spacing:.3em;color:#EBD9AE}
.g{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font:500 16px/28px "Noto Sans SC";font-variant-numeric:tabular-nums}
.g .h{font-size:13px;color:#C9A24A;letter-spacing:.1em}
.g .r{color:#E6684F}
.g .t{background:#9E2A1D;color:#F6E7C0;border-radius:0}
.addr{position:absolute;left:0;bottom:0;width:560px;display:flex;justify-content:space-between;align-items:center;padding:10px 20px;box-sizing:border-box;background:#9E2A1D;color:#F6E7C0;font:700 18px "Noto Sans SC";letter-spacing:.24em}
.addr i{font-style:normal;font:500 13px "Noto Sans SC";letter-spacing:.14em}
</style></head><body>
<div class="card">
 <div class="art">
  <svg viewBox="0 0 560 600" width="560" height="600">
   <rect width="560" height="600" fill="#17352F"/>
   <!-- 放射扇：Art Deco 太阳 -->
   <g transform="translate(280 400)">
    <g fill="#C9A24A">
     <path d="M0 0 L-260 -170 A310 310 0 0 1 -190 -245Z"/><path d="M0 0 L-150 -270 A310 310 0 0 1 -60 -304Z"/><path d="M0 0 L-25 -310 A310 310 0 0 1 70 -302Z"/>
     <path d="M0 0 L100 -293 A310 310 0 0 1 192 -243Z"/><path d="M0 0 L215 -223 A310 310 0 0 1 270 -153Z"/>
    </g>
    <g fill="#E6BE5B">
     <path d="M0 0 L-200 -150 A250 250 0 0 1 -140 -207Z" opacity=".0"/>
    </g>
    <circle r="112" fill="#9E2A1D"/>
   </g>
   <!-- 阶梯塔 -->
   <g fill="#EBD9AE"><rect x="0" y="470" width="90" height="130"/><rect x="0" y="420" width="60" height="50"/><rect x="0" y="380" width="30" height="40"/>
   <rect x="470" y="470" width="90" height="130"/><rect x="500" y="420" width="60" height="50"/><rect x="530" y="380" width="30" height="40"/></g>
   <g stroke="#17352F" stroke-width="3"><line x1="15" y1="500" x2="75" y2="500"/><line x1="15" y1="530" x2="75" y2="530"/><line x1="485" y1="500" x2="545" y2="500"/><line x1="485" y1="530" x2="545" y2="530"/></g>
   <!-- 咖啡杯：纯几何 -->
   <rect x="215" y="400" width="130" height="86" fill="#EBD9AE"/><path d="M345 418 h28 a22 22 0 0 1 0 44 h-28" fill="none" stroke="#EBD9AE" stroke-width="12"/>
   <rect x="195" y="494" width="170" height="10" fill="#C9A24A"/>
   <g fill="none" stroke="#EBD9AE" stroke-width="5"><path d="M250 380 q-12 -22 0 -44 q12 -22 0 -44"/><path d="M290 380 q-12 -22 0 -44 q12 -22 0 -44"/><path d="M330 380 q-12 -22 0 -44 q12 -22 0 -44"/></g>
   <!-- 顶部宽条 -->
   <rect x="0" y="0" width="560" height="14" fill="#C9A24A"/><rect x="0" y="22" width="560" height="4" fill="#C9A24A"/>
  </svg>
  <div class="addr">老虎灶咖啡烘焙所<i>静安路 108 号</i></div>
 </div>
 <div class="title">
  <div class="y">民国廿五年　孟冬</div>
  <h1>摩登<br>焙香</h1>
  <p>每日新焙 · 现磨现售<br>十月新豆　耶加雪菲 · 哥伦比亚</p>
 </div>
 <div class="cal">
  <div class="m"><b>十一月</b><span>NOVEMBER</span></div>
  <div class="g">
   <span class="h r">日</span><span class="h">一</span><span class="h">二</span><span class="h">三</span><span class="h">四</span><span class="h">五</span><span class="h">六</span>
   <span class="r">1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span>
   <span class="r">8</span><span>9</span><span>10</span><span>11</span><span class="t">12</span><span>13</span><span>14</span>
   <span class="r">15</span><span>16</span><span>17</span><span>18</span><span>19</span><span>20</span><span>21</span>
   <span class="r">22</span><span>23</span><span>24</span><span>25</span><span>26</span><span>27</span><span>28</span>
  </div>
 </div>
</div>
</body></html>
