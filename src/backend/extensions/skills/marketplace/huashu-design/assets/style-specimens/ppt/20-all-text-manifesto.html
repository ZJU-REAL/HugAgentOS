<h1 class="q">我们只为一件事付工资：<br>让客人带着一张<em>他会再放第二遍</em>的唱片回家。</h1>
<div class="pr">
<p>不是卖得最多，也不是店里最热闹。我们管这件事叫「<b>二刷测试</b>」：下次这位客人回来，如果他说「上次那张我又听了一遍」，你这周就做对了。</p>
<p>所以我们不推销库存。库存压得再多，也不能拿来换客人的耳朵。</p>
</div>
<div class="ft"><span>针尖唱片 · 店员手册</span><span>7</span></div>
