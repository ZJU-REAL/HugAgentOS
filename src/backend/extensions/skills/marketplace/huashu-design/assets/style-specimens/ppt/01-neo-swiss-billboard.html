<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>01 新瑞士大字报</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;900&family=Geist+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;900&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1200px;height:750px;overflow:hidden;background:#fff}
body{font-family:Inter,"Noto Sans SC",sans-serif;color:#0A0A0A;position:relative}
.top{position:absolute;left:56px;right:56px;top:36px;display:flex;justify-content:space-between;font:500 13px "Geist Mono",monospace;letter-spacing:.06em;color:#0A0A0A;padding-bottom:14px;border-bottom:2px solid #0A0A0A}
.top span:last-child{color:#555}
.num{position:absolute;left:44px;top:92px;font:900 330px/1 Inter,sans-serif;letter-spacing:-.075em;color:#2D5BFF;font-variant-numeric:tabular-nums}
.num small{font-size:150px;letter-spacing:-.04em;margin-left:6px}
.lead{position:absolute;left:56px;top:430px;width:900px;font:900 46px/1.2 "Noto Sans SC",sans-serif;letter-spacing:-.01em}
.cols{position:absolute;left:56px;right:56px;bottom:40px;height:150px;display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid #0A0A0A}
.c{padding:16px 20px 0 0;border-right:1px solid #E5E5E5;margin-right:20px}
.c:last-child{border:0}
.c b{display:block;font:700 44px/1 Inter;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.c b.up{color:#2D5BFF}
.c p{margin:10px 0 0;font:400 16px/1.45 "Noto Sans SC";color:#444}
.c i{font:500 12px "Geist Mono";font-style:normal;color:#666;letter-spacing:.06em;display:block;margin-bottom:10px}
.side{position:absolute;right:56px;top:116px;width:250px;text-align:right}
.side i{font:500 12px "Geist Mono";font-style:normal;color:#666;letter-spacing:.06em}
.side p{margin:8px 0 0;font:500 17px/1.5 "Noto Sans SC";color:#222}
</style></head><body>
<div class="top"><span>2026 Q3 · 业务回顾</span><span>城市公交改线 / 河东片区</span></div>
<div class="num">94.6<small>%</small></div>
<div class="side"><i>准点率 ON-TIME</i><p>改线后第 90 天<br>较改线前 +21.3 个百分点</p></div>
<div class="lead">不是多开了车，<br>是把绕路的那一段拿掉了。</div>
<div class="cols">
<div class="c"><i>平均候车</i><b>6.2<span style="font-size:22px">min</span></b><p>改线前 11.4 分钟</p></div>
<div class="c"><i>日均客流</i><b class="up">+18%</b><p>38,400 人次 / 日</p></div>
<div class="c"><i>线路长度</i><b>−3.1<span style="font-size:22px">km</span></b><p>由 17.8 缩至 14.7 公里</p></div>
<div class="c"><i>投诉量</i><b>−62%</b><p>月均 143 件降至 54 件</p></div>
</div>
</body></html>
