<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>20 日式留白白盒画廊</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&family=Noto+Sans+SC:wght@300;400&display=swap">
<style>
html,body{margin:0;width:1200px;height:750px;overflow:hidden}
body{background:#FAFAFA;color:#0A0A0A;font-family:Inter,"Noto Sans SC",sans-serif;font-weight:300;position:relative}
.top{position:absolute;top:34px;left:64px;right:64px;display:flex;justify-content:space-between;align-items:center;font-size:13px;letter-spacing:4px;color:#555}
.top b{font-weight:400;font-size:15px;letter-spacing:8px;color:#0A0A0A}
.top span span{margin-left:36px}
.lead{position:absolute;left:64px;top:104px;width:200px;font-size:14px;line-height:2.1;letter-spacing:2px;color:#555}
.lead h1{margin:0 0 16px;font-size:20px;font-weight:300;letter-spacing:6px;color:#0A0A0A;line-height:1.7}
.lead hr{width:24px;border:0;border-top:1px solid #0A0A0A;margin:0 0 16px;opacity:.5}
.m{position:absolute;left:330px;right:64px;top:104px;display:grid;grid-template-columns:repeat(4,1fr);gap:0 28px;align-items:start}
.col{display:flex;flex-direction:column;gap:22px}
.ph{position:relative}
.ph:after{content:"照片位";position:absolute;right:8px;bottom:6px;font-size:12px;letter-spacing:2px;color:rgba(0,0,0,.35)}
.cap{margin-top:8px;font-size:12.5px;letter-spacing:2px;color:#555;line-height:1.8;display:flex;justify-content:space-between}
.cap b{font-weight:400;color:#0A0A0A}
.foot{position:absolute;left:64px;bottom:30px;font-size:12.5px;letter-spacing:4px;color:#666}
</style></head><body>
<div class="top"><b>焙 · 初</b><span><span>豆子</span><span>器具</span><span>手记</span><span>购物袋 0</span></span></div>
<div class="lead"><h1>今季<br>十一种烘焙</h1><hr>每一包只烘一次，<br>每一次只记一个温度。<br><br>共 11 件 · 第 1 页</div>
<div class="m">
<div class="col"><div><div class="ph" style="height:250px;background:#D9CFC1"></div><div class="cap"><b>耶加雪菲 G1</b><span>¥ 98</span></div></div><div><div class="ph" style="height:150px;background:#EEEAE4"></div><div class="cap"><b>手冲壶 · 0.6L</b><span>¥ 468</span></div></div></div>
<div class="col" style="margin-top:56px"><div><div class="ph" style="height:170px;background:#B8A58E"></div><div class="cap"><b>哥伦比亚 慧兰</b><span>¥ 86</span></div></div><div><div class="ph" style="height:260px;background:#E6E2DC"></div><div class="cap"><b>陶滤杯 · 白</b><span>¥ 188</span></div></div></div>
<div class="col"><div><div class="ph" style="height:200px;background:#6F5A47"></div><div class="cap"><b>云南 保山 深烘</b><span>¥ 72</span></div></div><div><div class="ph" style="height:210px;background:#DAD6D0"></div><div class="cap"><b>磨豆机 · 手摇</b><span>¥ 398</span></div></div></div>
<div class="col" style="margin-top:28px"><div><div class="ph" style="height:230px;background:#EFEBE5"></div><div class="cap"><b>挂耳 · 综合 10 枚</b><span>¥ 59</span></div></div><div><div class="ph" style="height:180px;background:#C5B8A6"></div><div class="cap"><b>埃塞 古吉 日晒</b><span>¥ 92</span></div></div></div>
</div>
<div class="foot">每周四烘焙 · 周五发货</div>
</body></html>
