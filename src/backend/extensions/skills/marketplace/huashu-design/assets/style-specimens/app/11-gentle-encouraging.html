<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>11 柔和暗色鼓励式</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1200px;height:750px;overflow:hidden}*{box-sizing:border-box}
body{background:linear-gradient(160deg,#1A2338 0%,#202C4A 55%,#2B3555 100%);font-family:Nunito,"Noto Sans SC",sans-serif;color:#EAF0FF;position:relative}
.orb{position:absolute;border-radius:50%;filter:blur(60px)}
.ph{position:absolute;width:360px;height:760px;transform-origin:0 0;border-radius:52px;overflow:hidden;background:linear-gradient(180deg,#18213A,#1D2845);box-shadow:0 0 0 9px #0E1322,0 0 0 11px #38425F,0 30px 70px rgba(5,8,20,.5)}
.ph:before{content:"";position:absolute;top:11px;left:130px;width:100px;height:28px;border-radius:20px;background:#000;z-index:9}
.sb{height:50px;padding:14px 30px 0;display:flex;justify-content:space-between;font-weight:700;font-size:15px}
.hd{padding:10px 24px 0}.hd small{color:#9FB0D6;font-size:15px;font-weight:600}.hd h1{margin:4px 0 0;font-size:28px;line-height:1.25;font-weight:800}
.card{margin:16px 20px 0;background:#26335A;border-radius:28px;padding:20px}
.lab{font-size:14px;color:#A9B8DB;font-weight:700;letter-spacing:.03em}
.big{font-size:40px;font-weight:800;color:#fff;line-height:1}
.pill{display:inline-block;border-radius:20px;padding:4px 12px;font-size:14px;font-weight:700}
.mint{background:rgba(143,211,193,.18);color:#9BE0CC}.peach{background:rgba(242,201,160,.18);color:#F4D0A8}.lav{background:rgba(169,180,240,.2);color:#BAC3FA}
.zone{display:flex;justify-content:space-between;font-size:14px;color:#A9B8DB;font-weight:700;margin-top:6px}
.bar{height:10px;border-radius:6px;background:#1B2644;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;border-radius:6px}
.mon{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin-top:14px}
.mon b{aspect-ratio:1;border-radius:50%;background:#1B2644;display:block}
.mon b.a{background:#6FC3B0}.mon b.b{background:#9BE0CC}.mon b.c{background:#BAC3FA}.mon b.r{background:#F4D0A8;opacity:.8}
.sl{height:14px;border-radius:8px;background:linear-gradient(90deg,#8FD3C1,#BAC3FA,#F4D0A8);position:relative;margin:26px 0 8px}
.sl i{position:absolute;left:46%;top:-8px;width:30px;height:30px;border-radius:50%;background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.btn{margin:22px 20px 0;text-align:center;background:#9BE0CC;color:#12332B;border-radius:24px;padding:16px;font-weight:800;font-size:18px}
</style></head><body>
<div class="orb" style="left:80px;top:420px;width:380px;height:300px;background:#4A5FB0;opacity:.35"></div>
<div class="orb" style="left:760px;top:-80px;width:420px;height:300px;background:#4FAE9A;opacity:.25"></div>

<!-- 左后：月度 -->
<div class="ph" style="left:80px;top:98px;transform:scale(.88)">
 <div class="sb"><span>9:41</span><span>●●●</span></div>
 <div class="hd"><small>十月总结</small><h1>你这个月动了 17 天</h1></div>
 <div class="card"><div class="lab">每一天都算数</div>
  <div class="mon"><b class="a"></b><b class="b"></b><b></b><b class="a"></b><b class="c"></b><b class="r"></b><b class="b"></b><b class="a"></b><b></b><b class="b"></b><b class="a"></b><b class="r"></b><b class="c"></b><b class="a"></b><b class="b"></b><b></b><b class="a"></b><b class="b"></b><b class="r"></b><b class="a"></b><b class="b"></b><b class="c"></b><b></b><b class="a"></b><b class="b"></b><b class="a"></b><b></b><b></b></div>
 </div>
 <div class="card"><div class="lab">和上个月比</div><div style="font-size:19px;margin-top:8px;line-height:1.5;font-weight:600">多出 3 次轻松的散步。<br>没有断档，休息也是计划的一部分。</div></div>
</div>

<!-- 中：主屏 -->
<div class="ph" style="left:415px;top:40px">
 <div class="sb"><span>9:41</span><span>●●●</span></div>
 <div class="hd"><small>周四 · 今天</small><h1>今天适合轻松走一走</h1></div>
 <div class="card">
  <div style="display:flex;justify-content:space-between;align-items:center"><span class="lab">今日路径</span><span class="pill mint">恢复良好</span></div>
  <svg viewBox="0 0 300 120" style="width:100%;margin-top:8px"><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#F4D0A8"/><stop offset=".5" stop-color="#9BE0CC"/><stop offset="1" stop-color="#BAC3FA"/></linearGradient></defs>
   <path d="M6 96 C60 96 70 40 130 52 S210 100 294 22" fill="none" stroke="#1B2644" stroke-width="16" stroke-linecap="round"/>
   <path d="M6 96 C60 96 70 40 130 52 S210 100 294 22" fill="none" stroke="url(#g)" stroke-width="16" stroke-linecap="round" stroke-dasharray="190 400"/>
   <circle cx="168" cy="82" r="13" fill="#fff"/><circle cx="168" cy="82" r="5" fill="#26335A"/></svg>
  <div class="zone"><span>休息</span><span>轻松</span><span>活跃</span></div>
 </div>
 <div class="card" style="display:flex;gap:18px">
  <div style="flex:1"><div class="lab">心率变异</div><div class="big" style="margin-top:8px">52<span style="font-size:18px"> ms</span></div><div class="pill lav" style="margin-top:10px">比平时高 4</div></div>
  <div style="flex:1"><div class="lab">昨晚睡眠</div><div class="big" style="margin-top:8px">7<span style="font-size:18px">时</span>20</div><div class="pill mint" style="margin-top:10px">够用了</div></div>
 </div>
 <div class="card"><div class="lab">建议</div><div style="font-size:19px;margin-top:8px;line-height:1.5;font-weight:600">20 到 30 分钟的步行就很好，不用追赶任何人。</div></div>
 <div class="btn">开始轻松步行</div>
</div>

<!-- 右：运动感受 -->
<div class="ph" style="left:790px;top:132px;transform:scale(.9)">
 <div class="sb"><span>9:41</span><span>●●●</span></div>
 <div class="hd"><small>刚刚完成 · 步行 34 分钟</small><h1>这次练习感觉怎么样？</h1></div>
 <div class="card" style="padding:24px 22px">
  <div class="big" style="font-size:34px;color:#9BE0CC">刚刚好</div>
  <div class="sl"><i></i></div>
  <div class="zone"><span>很轻松</span><span>有点累</span><span>太吃力</span></div>
 </div>
 <div class="card"><div class="lab">我们会记住这个感受</div><div style="font-size:18px;margin-top:8px;line-height:1.55;font-weight:600">下次为你把强度排得更贴合一点。</div></div>
 <div class="btn">保存</div>
</div>
</body></html>
