<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>08 Y2K膨胀大字</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Anton&family=Noto+Sans+SC:wght@500;900&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1200px;height:750px;overflow:hidden;background:#FF2E93}
body{position:relative;color:#fff;font-family:"Noto Sans SC",sans-serif}
.cy{position:absolute;right:0;top:0;width:430px;height:750px;background:#00D9E8;clip-path:polygon(34% 0,100% 0,100% 100%,0 100%)}
.or{position:absolute;left:0;bottom:0;width:100%;height:120px;background:#FF8A00}
.photo{position:absolute;right:56px;top:70px;width:290px;height:380px;border-radius:150px 150px 24px 24px;background:linear-gradient(160deg,#FF2E93,#2B1BFF);overflow:hidden}
.photo i{position:absolute;inset:0;background:repeating-linear-gradient(45deg,rgba(255,255,255,.14) 0 2px,transparent 2px 14px);}
.photo span{position:absolute;left:0;right:0;bottom:16px;text-align:center;font:500 13px "Noto Sans SC";color:#fff;letter-spacing:.1em}
.kick{position:absolute;left:60px;top:48px;font:900 22px "Noto Sans SC";background:#000;padding:6px 16px;border-radius:30px;transform:rotate(-3deg)}
.num{position:absolute;left:40px;top:130px;font:400 300px/1 "Archivo Black";letter-spacing:-.06em;color:#FFE600;
  text-shadow:2px 2px 0 #FF8A00,4px 4px 0 #FF8A00,6px 6px 0 #FF8A00,8px 8px 0 #FF8A00,10px 10px 0 #E0600A,12px 12px 0 #E0600A,14px 14px 0 #E0600A,16px 16px 0 #B03C00,18px 18px 0 #B03C00,20px 20px 0 #B03C00,22px 22px 0 #7A2400,24px 24px 0 #7A2400,28px 34px 30px rgba(0,0,0,.35);
  transform:perspective(900px) rotateX(8deg) rotateZ(-5deg);transform-origin:left center}
.cap{position:absolute;left:68px;top:450px;font:900 60px/1.15 "Noto Sans SC"}
.cap small{display:block;font:500 22px "Noto Sans SC";margin-top:10px;color:#fff}
.or p{margin:0;position:absolute;left:68px;top:34px;font:900 30px "Noto Sans SC";color:#000;letter-spacing:.02em}
.or b{position:absolute;right:56px;top:36px;font:900 28px "Archivo Black";color:#000}
</style></head><body>
<div class="cy"></div>
<div class="photo"><i></i><span>人像位 · 双色调</span></div>
<div class="kick">你的 2026 骑行年报</div>
<div class="num">2847</div>
<div class="cap">公里。<small>绕地球 7%，你把城市骑了个遍。</small></div>
<div class="or"><p>最爱的一条路：滨江绿道 · 118 次</p><b>#骑行年报</b></div>
</body></html>
