<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>04 友好金融</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700;800&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1200px;height:750px;overflow:hidden}*{box-sizing:border-box}
body{background:#14233C;font-family:Figtree,"Noto Sans SC",sans-serif;color:#14233C;position:relative}
.ph{position:absolute;width:360px;height:760px;transform-origin:0 0;border-radius:52px;overflow:hidden;box-shadow:0 0 0 9px #0A1424,0 0 0 11px #3B4C6B,0 34px 70px rgba(0,0,0,.45)}
.ph:before{content:"";position:absolute;top:11px;left:130px;width:100px;height:28px;border-radius:20px;background:#000;z-index:9}
.sb{height:50px;padding:14px 30px 0;display:flex;justify-content:space-between;font-weight:700;font-size:15px}
.coral{background:#FF4F40;color:#fff}
.bal{padding:10px 26px 0}.bal small{font-size:16px;font-weight:700;opacity:.92}
.bal .n{font-size:58px;font-weight:800;letter-spacing:-2px;line-height:1.1}
.pills{display:flex;gap:10px;padding:14px 26px 0}.pills span{background:#fff;color:#14233C;border-radius:30px;padding:11px 20px;font-weight:800;font-size:16px}
.pills span.o{background:rgba(255,255,255,.22);color:#fff}
.sheet{position:absolute;left:0;right:0;bottom:0;top:292px;background:#fff;border-radius:34px 34px 0 0;padding:22px 22px;color:#14233C}
.tr{display:flex;align-items:center;gap:14px;padding:11px 0}
.ic{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:19px;flex:none}
.tr b{font-size:17px;font-weight:700}.tr small{display:block;font-size:14px;color:#6B778C;margin-top:2px;font-weight:500}.tr .a{margin-left:auto;font-weight:800;font-size:17px}
.sec{font-size:15px;font-weight:800;color:#6B778C;margin:6px 0 4px;letter-spacing:.02em}
.pots{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:6px 20px}
.pot{border-radius:28px;padding:18px;min-height:150px;position:relative}
.pot b{font-size:18px;font-weight:800}.pot .v{font-size:30px;font-weight:800;letter-spacing:-1px;margin-top:30px}
.pot .bar{height:8px;border-radius:5px;background:rgba(20,35,60,.15);margin-top:10px}.pot .bar i{display:block;height:100%;border-radius:5px;background:#14233C}
.h1{font-size:30px;font-weight:800;padding:8px 26px 0;letter-spacing:-.5px;line-height:1.2}
.cta{margin:16px 20px 0;background:#14233C;color:#fff;border-radius:40px;text-align:center;padding:17px;font-weight:800;font-size:18px}
</style></head><body>

<div class="ph coral" style="left:70px;top:70px;transform:scale(.96)">
 <div class="sb"><span>9:41</span><span>●●●</span></div>
 <div class="bal"><small>主账户</small><div class="n">¥3,284.60</div><small style="font-weight:600">本月还能花 ¥1,150</small></div>
 <div class="pills"><span>转账</span><span class="o">预算</span><span class="o">明细</span></div>
 <div class="sheet">
  <div class="sec">今天</div>
  <div class="tr"><div class="ic" style="background:#FFE9A8;color:#8A6200">咖</div><div><b>山雀咖啡烘焙</b><small>餐饮 · 08:42</small></div><div class="a">-¥32.00</div></div>
  <div class="tr"><div class="ic" style="background:#CDEBFF;color:#0B5A8E">车</div><div><b>地铁</b><small>交通 · 08:10</small></div><div class="a">-¥4.00</div></div>
  <div class="sec">昨天</div>
  <div class="tr"><div class="ic" style="background:#D5F5DC;color:#1E6B34">薪</div><div><b>十月工资</b><small>收入</small></div><div class="a" style="color:#1E9E4F">+¥8,600.00</div></div>
  <div class="tr"><div class="ic" style="background:#F6D6F0;color:#8A2A7B">电</div><div><b>电影票两张</b><small>娱乐 · 21:15</small></div><div class="a">-¥96.00</div></div>
 </div>
</div>

<div class="ph" style="left:450px;top:34px;background:#FFF4EF">
 <div class="sb"><span>9:41</span><span>●●●</span></div>
 <div class="h1">十月预算</div>
 <div style="padding:6px 26px 10px;font-size:17px;font-weight:600;color:#55627A">还剩 ¥1,150 · 距离月底 14 天</div>
 <div class="pots">
  <div class="pot" style="background:#FFD66B"><b>餐饮</b><div class="v">¥640</div><div class="bar"><i style="width:58%"></i></div></div>
  <div class="pot" style="background:#9AD8FF"><b>交通</b><div class="v">¥120</div><div class="bar"><i style="width:22%"></i></div></div>
  <div class="pot" style="background:#C8F0CE"><b>储蓄罐</b><div class="v">¥2,000</div><div class="bar"><i style="width:80%"></i></div></div>
  <div class="pot" style="background:#F9B9E8"><b>娱乐</b><div class="v">¥96</div><div class="bar"><i style="width:34%"></i></div></div>
  <div class="pot" style="background:#D8CBFF"><b>房租</b><div class="v">¥2,400</div><div class="bar"><i style="width:100%"></i></div></div>
  <div class="pot" style="background:#14233C;color:#fff;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:300">+</div>
 </div>
 <div class="cta">新建一个罐子</div>
</div>

<div class="ph" style="left:830px;top:140px;transform:scale(.92);background:#fff">
 <div class="sb"><span>9:41</span><span>●●●</span></div>
 <div class="h1">这个月，<br>钱去了哪里</div>
 <div style="margin:18px auto 0;width:240px;height:240px;border-radius:50%;background:conic-gradient(#FF4F40 0 38%,#FFD66B 0 58%,#9AD8FF 0 72%,#C8F0CE 0 86%,#D8CBFF 0 100%);position:relative"><div style="position:absolute;inset:48px;border-radius:50%;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center"><small style="font-weight:700;color:#6B778C;font-size:15px">已花</small><b style="font-size:34px;letter-spacing:-1px;font-weight:800">¥4,250</b></div></div>
 <div style="padding:22px 26px 0;font-size:17px;font-weight:700;line-height:2">
  <div style="display:flex;gap:10px;align-items:center"><i style="width:14px;height:14px;border-radius:50%;background:#FF4F40"></i>房租与账单<span style="margin-left:auto">38%</span></div>
  <div style="display:flex;gap:10px;align-items:center"><i style="width:14px;height:14px;border-radius:50%;background:#FFD66B"></i>餐饮<span style="margin-left:auto">20%</span></div>
  <div style="display:flex;gap:10px;align-items:center"><i style="width:14px;height:14px;border-radius:50%;background:#9AD8FF"></i>交通<span style="margin-left:auto">14%</span></div>
 </div>
</div>
</body></html>
