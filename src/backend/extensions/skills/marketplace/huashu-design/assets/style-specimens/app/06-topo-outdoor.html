<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>06 户外地形工具</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1200px;height:750px;overflow:hidden}*{box-sizing:border-box}
body{background:#2F3B2C;font-family:"Noto Sans SC","Barlow Condensed",sans-serif;color:#2A2A22;position:relative}
.bg{position:absolute;inset:0;opacity:.5}
.ph{position:absolute;width:360px;height:760px;transform-origin:0 0;border-radius:52px;overflow:hidden;background:#EFEBDA;box-shadow:0 0 0 9px #121512,0 0 0 11px #4B5547,0 28px 60px rgba(0,0,0,.5)}
.ph:before{content:"";position:absolute;top:11px;left:130px;width:100px;height:28px;border-radius:20px;background:#000;z-index:20}
.sb{height:50px;padding:14px 30px 0;display:flex;justify-content:space-between;font-weight:700;font-size:15px;position:relative;z-index:5}
.map{position:absolute;inset:0}
.pan{position:absolute;left:12px;right:12px;background:#FBFAF2;border-radius:22px;padding:16px 18px;box-shadow:0 8px 24px rgba(30,40,20,.3);z-index:6}
.n{font-family:"Barlow Condensed";font-weight:700;letter-spacing:.01em}
.lbl{font-size:13px;color:#6B6A58;font-weight:700;letter-spacing:.06em}
.stats{display:flex;justify-content:space-between}
.stats div{text-align:left}.stats .n{font-size:40px;line-height:1}
.chip{position:absolute;z-index:6;background:#FBFAF2;border-radius:12px;padding:8px 12px;font-weight:700;font-size:14px;box-shadow:0 4px 10px rgba(0,0,0,.25)}
.card{display:flex;gap:14px;background:#FBFAF2;border-radius:18px;padding:14px;margin:0 16px 12px;align-items:center;box-shadow:0 2px 0 #D9D4BE}
.mini{width:96px;height:72px;border-radius:12px;background:#E8E3CE;position:relative;overflow:hidden;flex:none}
.card b{font-size:17px}.card .m{font-size:14px;color:#6B6A58;margin-top:2px}
.dif{display:inline-block;font-size:13px;font-weight:700;padding:2px 8px;border-radius:8px;margin-top:6px}
</style></head><body>
