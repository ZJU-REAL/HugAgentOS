<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>03 民国书衣</title>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont/style.css">
<style>
html,body{margin:0;width:1200px;height:750px;overflow:hidden;background:#BDB6A6}
body{position:relative;font-family:"Noto Serif SC",serif;color:#1E1B17}
.flat{position:absolute;left:50px;top:40px;width:1100px;height:670px;display:flex;box-shadow:0 12px 26px -12px rgba(30,20,10,.5)}
.back{width:470px;background:#CFC3A0;position:relative}
.spine{width:70px;background:#CFC3A0;position:relative;border-left:1px solid rgba(30,27,23,.35);border-right:1px solid rgba(30,27,23,.35)}
.front{width:560px;background:#CFC3A0;position:relative}
.frame{position:absolute;inset:30px;border:2px solid #1E1B17}
.frame:after{content:"";position:absolute;inset:5px;border:1px solid #1E1B17}
.label{position:absolute;left:88px;top:76px;width:92px;height:300px;background:#EFE8D3;border:1px solid #1E1B17;display:flex;justify-content:center}
.label b{writing-mode:vertical-rl;font:400 76px/1 "LXGW WenKai","Ma Shan Zheng",serif;letter-spacing:.14em;margin-top:26px;color:#1E1B17}
.who{position:absolute;left:206px;top:84px;writing-mode:vertical-rl;font:400 19px/1.6 "Noto Serif SC";letter-spacing:.3em}
.sub{position:absolute;left:250px;top:84px;writing-mode:vertical-rl;font:400 15px/1.6 "Noto Serif SC";letter-spacing:.22em;color:#4B4338}
.art{position:absolute;left:43px;bottom:43px;overflow:hidden}
.press{position:absolute;right:68px;bottom:50px;font:400 14px "Noto Serif SC";letter-spacing:.24em;writing-mode:vertical-rl;color:#1E1B17;display:none}
.imprint{position:absolute;left:88px;bottom:40px;font:400 13px "Noto Serif SC";letter-spacing:.2em;color:#4B4338;background:#CFC3A0;padding:0 8px 0 0}
.sp{position:absolute;inset:0}
.sp .t{position:absolute;left:50%;top:70px;transform:translateX(-50%);writing-mode:vertical-rl;font:400 34px/1 "LXGW WenKai","Ma Shan Zheng";letter-spacing:.2em}
.sp .p{position:absolute;left:50%;transform:translateX(-50%);top:420px;writing-mode:vertical-rl;font:400 15px "Noto Serif SC";letter-spacing:.3em}
.sp .m{position:absolute;left:50%;bottom:70px;transform:translateX(-50%);width:20px;height:20px;background:#B02A1C}
.bk h4{margin:0;position:absolute;left:70px;top:90px;font:400 17px/2.1 "Noto Serif SC";letter-spacing:.06em;width:290px}
.bk .bc{position:absolute;left:70px;bottom:70px;width:150px;height:70px;border:1px solid #1E1B17;font:400 12px "Noto Serif SC";display:flex;align-items:center;justify-content:center;color:#4B4338;text-align:center}
.bk .ph{position:absolute;right:70px;top:90px;width:0;height:0}
.note{position:absolute;left:30px;bottom:50px;font:400 12px "Noto Serif SC";color:#4B4338;letter-spacing:.1em}
.dg{position:absolute;right:20px;top:20px;font:400 12px "Noto Serif SC";color:#4B4338;letter-spacing:.1em}
</style></head><body>
<div class="flat">
 <div class="back bk">
  <div class="frame"></div>
  <h4>三十七年前的一个秋天，几个人带着干粮和一张手绘的图，从东口入山，在二十八天里走过了十一道梁、六条沟。这本小书记的就是那条线，以及线上每一晚的炊烟。</h4>
  <div class="bc">条码位</div>
  <div class="note" style="left:70px;bottom:150px">定价 四十八元</div><div class="imprint" style="left:auto;right:70px;bottom:70px;background:none">二〇二六年十月 · 初版</div>
 </div>
 <div class="spine">
  <div class="sp"><div class="t">山行二十八日</div><div class="p">林远 著</div><div class="m"></div></div>
 </div>
 <div class="front">
  <div class="frame"></div>
  <div class="label"><b>山行</b></div>
  <div class="who">林远　著</div>
  <div class="sub">秦岭东线徒步手记</div>
  <svg class="art" viewBox="0 0 500 250" preserveAspectRatio="none" style="width:474px;height:224px">
   <rect width="500" height="250" fill="#CFC3A0"/>
   <!-- 红日 -->
   <circle cx="350" cy="86" r="48" fill="#B02A1C"/>
   <!-- 三层山：平涂+排线 -->
   <polygon points="0,250 0,150 70,96 140,170 210,70 300,190 380,120 500,200 500,250" fill="#1E1B17"/>
   <polygon points="0,250 0,200 90,150 180,210 260,150 340,220 430,170 500,215 500,250" fill="#CFC3A0"/>
   <g stroke="#1E1B17" stroke-width="2">
    <line x1="0" y1="212" x2="500" y2="212"/><line x1="0" y1="222" x2="500" y2="222"/>
    <line x1="0" y1="232" x2="500" y2="232"/><line x1="0" y1="242" x2="500" y2="242"/>
   </g>
   <polygon points="210,70 235,104 185,104" fill="#EFE8D3"/>
   <polygon points="70,96 86,118 54,118" fill="#EFE8D3"/>
  </svg>
 </div>
</div>
</body></html>
