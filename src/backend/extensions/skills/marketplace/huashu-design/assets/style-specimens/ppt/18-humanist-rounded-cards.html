<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>18 人文圆角卡片</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700;900&family=Noto+Sans+SC:wght@400;500;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&family=Nunito+Sans:wght@400;600;700;800&display=swap">
<style>
html,body{margin:0;width:1200px;height:750px;overflow:hidden}
body{background:#FBF6EC;color:#21302B;font-family:'Nunito Sans','Noto Sans SC',sans-serif;position:relative}
.eyebrow{position:absolute;left:64px;top:48px;display:inline-block;background:#D9F2EA;color:#0A5C4B;border-radius:999px;padding:7px 16px;font-size:14px;font-weight:700}
h1{position:absolute;left:64px;top:96px;margin:0;width:760px;font-family:'Source Serif 4','Noto Serif SC',serif;font-weight:700;font-size:46px;line-height:1.3;color:#0A3D32}
.lead{position:absolute;left:64px;top:176px;width:640px;font-size:19px;line-height:1.75;color:#3E4F49}
.cta{position:absolute;right:64px;top:62px;background:#0A5C4B;color:#fff;border-radius:999px;padding:14px 26px;font-size:17px;font-weight:700}
.cards{position:absolute;left:64px;right:64px;top:300px;display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.card{background:#fff;border-radius:28px;padding:14px 14px 22px;box-shadow:0 6px 22px rgba(10,61,50,.10)}
.ph{height:190px;border-radius:18px;position:relative;overflow:hidden}
.ph span{position:absolute;left:14px;bottom:10px;font-size:12px;font-weight:700;background:rgba(255,255,255,.88);color:#0A5C4B;border-radius:999px;padding:4px 10px}
.ph i{position:absolute;border-radius:50%}
.p1{background:#BFE8DB}.p1 i:nth-child(1){width:150px;height:150px;background:#14BF96;right:-30px;top:-50px}.p1 i:nth-child(2){width:80px;height:80px;background:#F6C453;left:34px;top:46px}
.p2{background:#F9DDBB}.p2 i:nth-child(1){width:170px;height:170px;background:#EE9B5B;left:-40px;top:20px}.p2 i:nth-child(2){width:90px;height:90px;background:#0A5C4B;right:34px;top:-24px}
.p3{background:#D5E3F6}.p3 i:nth-child(1){width:140px;height:140px;background:#5B8BD6;right:20px;top:34px}.p3 i:nth-child(2){width:70px;height:70px;background:#F6C453;left:30px;top:-18px}
.card h3{margin:18px 10px 8px;font-family:'Source Serif 4','Noto Serif SC',serif;font-size:26px;font-weight:700;color:#0A3D32}
.card p{margin:0 10px 14px;font-size:16px;line-height:1.65;color:#4A5B55}
.chips{margin:0 10px;display:flex;gap:8px;flex-wrap:wrap}
.chips b{font-size:14px;font-weight:700;background:#F1ECDF;color:#4B4A3F;border-radius:999px;padding:5px 12px}
.chips b.g{background:#D9F2EA;color:#0A5C4B}
.note{position:absolute;right:64px;top:176px;width:300px;background:#FFF1CC;border-radius:24px;padding:16px 20px;font-size:16px;line-height:1.6;color:#5A4A12;transform:rotate(1.2deg)}
.note b{font-family:'Source Serif 4','Noto Serif SC',serif;font-size:22px;color:#4B3C08}
</style></head><body>
<div class="eyebrow">梧桐里社区夜校 · 秋季学期</div>
<div class="cta">报名 10 月 28 日开课</div>
<h1>下班之后，邻居们一起学点新东西</h1>
<div class="lead">不考试，不打分，也没有谁需要比别人学得快。每门课十二周，每周二、四晚上七点，在街道活动中心二楼。</div>
<div class="note"><b>今年新增</b><br>为带孩子的家长开设「陪读教室」，学习时间里孩子有人看护。</div>
<div class="cards">
<div class="card"><div class="ph p1"><i></i><i></i><span>照片位</span></div><h3>手机摄影与家庭相册</h3><p>从光线讲起，给家人拍出好看的日常。</p><div class="chips"><b class="g">零基础</b><b>周二 19:00</b><b>12 人班</b></div></div>
<div class="card"><div class="ph p2"><i></i><i></i><span>照片位</span></div><h3>家常菜的减盐练习</h3><p>跟着退休的食堂师傅，少放盐也好吃。</p><div class="chips"><b class="g">适合老人</b><b>周四 19:00</b><b>10 人班</b></div></div>
<div class="card"><div class="ph p3"><i></i><i></i><span>照片位</span></div><h3>写给未来的一封信</h3><p>每周写一小段，学期末装订成册。</p><div class="chips"><b class="g">零基础</b><b>周四 19:00</b><b>15 人班</b></div></div>
</div>
</body></html>
