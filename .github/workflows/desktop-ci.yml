# Validate desktop changes before they reach the release-only workflow.
name: Desktop CI

on:
  pull_request:
    paths:
      - "desktop/**"
      - "src/frontend/**"
      - ".github/workflows/desktop-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scripts:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install desktop toolchain
        working-directory: desktop
        run: npm ci --no-audit --no-fund

      - name: Test release and CE payload helpers
        working-directory: desktop
        run: npm run test:scripts

  platform-tests:
    name: ${{ matrix.name }}
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
      HUGAGENT_DESKTOP_BUNDLE: "full"
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64 offline cold start
            os: ubuntu-22.04
          - name: Windows x86_64 offline cold start
            os: windows-2025
          - name: macOS Apple Silicon offline cold start
            os: macos-15
          - name: macOS Intel offline cold start
            os: macos-15-intel

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Used only by the release builder to create deterministic archives.
      # The packaged runtime is still the private CPython installed by uv.
      - name: Setup Python archive tooling
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linux system dependencies
        if: startsWith(matrix.os, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            file

      - name: Setup pinned uv release builder
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.33"
          enable-cache: true

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install frontend dependencies
        working-directory: src/frontend
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Install desktop toolchain
        working-directory: desktop
        run: npm ci --no-audit --no-fund

      - name: Stage the public CE local-server payload
        working-directory: desktop
        run: node scripts/prepare-bundle.mjs

      - name: Run desktop Rust tests
        run: cargo test --manifest-path desktop/src-tauri/Cargo.toml --lib

      - name: Exercise the real offline install and health endpoint
        run: >-
          cargo test --manifest-path desktop/src-tauri/Cargo.toml
          generated_payload_installs_and_serves_health_endpoint
          -- --ignored --nocapture
