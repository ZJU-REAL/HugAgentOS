name: PR review context

on:
  pull_request:
    types: [opened, synchronize, edited, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-review-context-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  context:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout review input with read-only credentials
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test explanation and privacy checks
        run: node --test scripts/test-pr-review-context.mjs
      - name: Validate and publish the change walkthrough
        run: node scripts/pr-review-context.mjs
