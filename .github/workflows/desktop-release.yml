# Build and publish the HugAgentOS Tauri desktop client from the public CE tree.
#
# This workflow belongs to the CE overlay because the main repository excludes
# `.github/**` during derivation. Windows and macOS stage the already-derived
# tracked CE checkout as their local-server payload.
#
# Required repository secrets:
#   TAURI_SIGNING_PRIVATE_KEY
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD
# macOS requires APPLE_CERTIFICATE and APPLE_CERTIFICATE_PASSWORD.
# vars.MACOS_SIGNING_MODE defaults to developer-id:
#   APPLE_SIGNING_IDENTITY is the full Developer ID Application identity;
#   APPLE_ID, APPLE_PASSWORD and APPLE_TEAM_ID enable notarization.
# In explicit self-signed mode APPLE_SIGNING_IDENTITY is the fixed certificate's
# 40-hex SHA-1 fingerprint; no Apple account or notarization is used.
# Missing credentials fail the macOS jobs. Ad-hoc fallback is never allowed.
#
# To cut a release:
#   1. Run `npm --prefix desktop run version:desktop -- X.Y.Z` and commit the
#      synchronized version files.
#   2. Push `desktop-vX.Y.Z`, or manually dispatch this workflow from that commit;
#      manual runs derive the release tag from the committed desktop version.
#   3. Review the draft release after every platform succeeds, then publish it.

name: Desktop Release

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-release:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.desktop_version.outputs.version }}
      release_tag: ${{ steps.desktop_version.outputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test desktop release helpers
        working-directory: desktop
        run: npm run test:scripts

      - name: Validate release tag and desktop versions
        id: desktop_version
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: node desktop/scripts/validate-release-version.mjs "$RELEASE_TAG"

  build:
    needs: validate-release
    permissions:
      contents: write
    strategy:
      # Preserve successful Windows/Linux artifacts when one signing platform
      # is temporarily misconfigured.
      fail-fast: false
      matrix:
        include:
          # Offline Python is architecture-specific. Build two native macOS
          # packages; a universal shell with one Python architecture is invalid.
          - name: macOS Apple Silicon
            platform: macos-15
            args: "--bundles app,dmg"
          - name: macOS Intel
            platform: macos-15-intel
            args: "--bundles app,dmg"
          # Linux: tauri.linux.conf.json overrides targets to AppImage + deb.
          - name: Linux x86_64
            platform: ubuntu-22.04
            args: ""
          # Windows: the base configuration builds the NSIS installer.
          - name: Windows x86_64
            platform: windows-2025
            args: ""

    runs-on: ${{ matrix.platform }}
    name: ${{ matrix.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            file

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Used only by the release builder to create deterministic archives.
      # The packaged runtime is still the private CPython installed by uv.
      - name: Setup Python archive tooling
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup pinned uv release builder
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.33"
          enable-cache: true

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      # The public CE tree intentionally has no frontend lockfile. Avoid
      # generating one so the release checkout remains clean for payload staging.
      - name: Install frontend dependencies
        working-directory: src/frontend
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Install desktop toolchain (@tauri-apps/cli)
        working-directory: desktop
        # The derived CE tree stages tracked files for the release payload. Use
        # the lockfile exactly as committed so npm does not dirty the checkout.
        run: npm ci --no-audit --no-fund

      - name: Verify dependency installation kept the checkout clean
        run: git diff --exit-code -- desktop/package-lock.json

      # Import the identity before resource preparation: the embedded runtime
      # is signed before Tauri reaches its own application-signing phase.
      # Certificate material is handled by the import action, not GITHUB_ENV.
      - name: Configure macOS signing
        if: startsWith(matrix.platform, 'macos-')
        shell: bash
        env:
          MACOS_SIGNING_MODE: ${{ vars.MACOS_SIGNING_MODE || 'developer-id' }}
          APPLE_CERTIFICATE_SECRET: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD_SECRET: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY_SECRET: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID_SECRET: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD_SECRET: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID_SECRET: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ -z "$APPLE_CERTIFICATE_SECRET" || -z "$APPLE_CERTIFICATE_PASSWORD_SECRET" ||
                -z "$APPLE_SIGNING_IDENTITY_SECRET" ]]; then
            echo "::error::macOS releases require a certificate, private key, password and signing identity."
            exit 1
          fi
          case "$MACOS_SIGNING_MODE" in
            developer-id)
              if [[ -z "$APPLE_ID_SECRET" || -z "$APPLE_PASSWORD_SECRET" || -z "$APPLE_TEAM_ID_SECRET" ]]; then
                echo "::error::Developer ID releases require complete Apple notarization credentials."
                exit 1
              fi
              {
                printf 'APPLE_ID=%s\n' "$APPLE_ID_SECRET"
                printf 'APPLE_PASSWORD=%s\n' "$APPLE_PASSWORD_SECRET"
                printf 'APPLE_TEAM_ID=%s\n' "$APPLE_TEAM_ID_SECRET"
              } >> "$GITHUB_ENV"
              echo "Using Developer ID signing and notarization."
              ;;
            self-signed)
              if [[ ! "$APPLE_SIGNING_IDENTITY_SECRET" =~ ^[A-Fa-f0-9]{40}$ ]]; then
                echo "::error::Self-signed releases require a fixed 40-hex certificate SHA-1 fingerprint."
                exit 1
              fi
              echo "Using fixed self-signed identity; this package is not Apple-notarized."
              ;;
            *)
              echo "::error::Unknown MACOS_SIGNING_MODE; choose developer-id or self-signed."
              exit 1
              ;;
          esac
          {
            printf 'HUGAGENT_MACOS_SIGNING_MODE=%s\n' "$MACOS_SIGNING_MODE"
            printf 'APPLE_SIGNING_IDENTITY=%s\n' "$APPLE_SIGNING_IDENTITY_SECRET"
          } >> "$GITHUB_ENV"

      - name: Import macOS signing identity
        id: import_macos_identity
        if: startsWith(matrix.platform, 'macos-')
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          HUGAGENT_RELEASE_BUILD: "1"
          # tsc + Vite peaks near Node's default heap limit on hosted runners.
          NODE_OPTIONS: "--max-old-space-size=4096"
        with:
          projectPath: desktop
          tagName: ${{ needs.validate-release.outputs.release_tag }}
          releaseName: "HugAgentOS Desktop __VERSION__"
          releaseBody: "Download the installer for your platform below. See the docs for setup."
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}

      # The release remains a draft until every platform, including this
      # verification of the actual signed bundle, has succeeded.
      - name: Verify macOS release identity for the selected signing mode
        if: startsWith(matrix.platform, 'macos-')
        working-directory: desktop
        run: npm run verify:macos -- --bundle-dir src-tauri/target/release/bundle/macos

      - name: Remove temporary macOS signing keychain
        if: always() && startsWith(matrix.platform, 'macos-') && steps.import_macos_identity.outcome == 'success'
        run: security delete-keychain signing_temp.keychain
