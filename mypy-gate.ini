# Blocking type gate for the Personal Agent desktop chain (CI job "type-check").
#
# Checks only the error codes that catch a wrong name: an attribute or module member
# that does not exist (attr-defined, e.g. `settings.port` on the frozen AppSettings,
# whose port is `settings.server.port`), an undefined name (name-defined) and a call
# with wrong or missing arguments (call-arg). Every other default code is disabled
# below, so the gate stays green on the existing annotation debt and fails only on
# this class of bug. The list matches mypy 2.4.1; CI pins that version, because a
# newer mypy may add default codes that this list does not disable.
#
# Run exactly as CI does, from the repo root:
#   mypy --config-file mypy-gate.ini src/backend/personal_agent/ src/backend/hugagent_cli/ src/backend/features/desktop/
[mypy]
python_version = 3.11
mypy_path = src/backend
explicit_package_bases = True
ignore_missing_imports = True
# Imported modules are analysed for their types, but only the paths given are reported.
follow_imports = silent
cache_dir = /tmp/hugagent-mypy-gate-cache
disable_error_code =
    abstract,
    annotation-unchecked,
    arg-type,
    assert-type,
    assignment,
    await-not-async,
    call-overload,
    comparison-overlap,
    dict-item,
    empty-body,
    exit-return,
    explicit-any,
    func-returns-value,
    has-type,
    import,
    index,
    list-item,
    literal-required,
    maybe-unrecognized-str-typeform,
    metaclass,
    method-assign,
    misc,
    name-match,
    narrowed-type-not-subtype,
    no-any-return,
    no-any-unimported,
    no-overload-impl,
    no-redef,
    no-untyped-call,
    no-untyped-def,
    nonetype-type,
    operator,
    override,
    redundant-cast,
    return,
    return-value,
    safe-super,
    str-bytes-safe,
    str-format,
    str-unpack,
    top-level-await,
    truthy-function,
    type-abstract,
    type-arg,
    type-var,
    typeddict-item,
    typeddict-readonly-mutated,
    union-attr,
    unreachable,
    untyped-decorator,
    unused-coroutine,
    used-before-def,
    valid-newtype,
    valid-type,
    var-annotated
