# Opt-in application data database, separate from the platform postgres service.
# docker compose -f docker-compose.yml -f docker-compose.application-hosting.yml up -d
services:
  application-postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: applications
      POSTGRES_USER: application_admin
      POSTGRES_PASSWORD: ${APPLICATION_DB_PASSWORD:?Set a separate APPLICATION_DB_PASSWORD}
    volumes:
      - application_postgres_data:/var/lib/postgresql/data
    networks:
      - hugagent-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U application_admin -d applications"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  application-database-init:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: production
    volumes:
      - ./src/backend:/app/src/backend:ro
    command: ["python", "-m", "core.services.application_hosting_setup"]
    environment:
      APPLICATION_DATABASE_URL: postgresql://application_admin:${APPLICATION_DB_PASSWORD}@application-postgres:5432/applications
    networks:
      - hugagent-network
    depends_on:
      application-postgres:
        condition: service_healthy
    restart: "no"
  backend:
    environment:
      APPLICATION_DATABASE_URL: postgresql://application_admin:${APPLICATION_DB_PASSWORD}@application-postgres:5432/applications
    depends_on:
      application-database-init:
        condition: service_completed_successfully

volumes:
  application_postgres_data:
