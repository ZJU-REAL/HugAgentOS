[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hugagent"
version = "0.1.0"
description = "Multi-agent platform with MCP integration (AgentScope 2.0)"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "HugAgentOS Team"}
]
# Runtime deps are declared once in requirements.txt (the single source of
# truth); read them dynamically so `pip install .` and the compose/venv paths
# never drift. The no-Docker quick-install installer (`install.sh` in CE)
# installs requirements.txt then `pip install --no-deps .` for the console entry.
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
    "import-linter>=2.15,<3",
]

# Console entries. `hugagent-server` runs the no-Docker local profile (onboard /
# serve / doctor / engine); `hugagent-session` is the lightweight cloud/device
# session client. The `hugagent` name belongs to the npm terminal client
# (packages/cli), which forwards server commands to `hugagent-server`. CE and EE
# share these technical identifiers.
[project.scripts]
hugagent-server = "cli:main"
hugagent-session = "hugagent_cli.main:main"

# ── Packaging: src/backend is the import root ────────────────────────────────
# The project has always run with PYTHONPATH=src/backend (top-level `api`,
# `core`, `orchestration`, … packages). Declare that so an editable/source
# install exposes them and the `hugagent-server` console script resolves `cli:main`.
[tool.setuptools]
package-dir = {"" = "src/backend"}
py-modules = ["cli"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["src/backend"]
include = [
    "api*", "core*", "orchestration*", "prompts*", "extensions*",
    "hugagent_cli*", "edition_ee*", "personal_agent*", "features*", "integrations*",
]
# alembic migrations / tests / uploads / scripts are not import-time runtime deps.
exclude = ["tests*", "alembic*", "uploads*", "scripts*"]

# Bundle manifests, prompts, scripts and binary assets are runtime resources.
[tool.setuptools.package-data]
extensions = ["README.md", "skills/**/*", "agents/**/*", "plugins/**/*", "mcp_servers/**/*.md"]
"features.workbench" = ["schemas/*.json"]
"core.config" = ["*.json"]
prompts = ["config/*.json", "prompt_text/**/*.md"]
"personal_agent.workspace" = ["prompts/*.md"]
"core.sandbox.oslayer" = ["profiles/*"]

[tool.setuptools.exclude-package-data]
"*" = ["**/__pycache__/*", "**/*.pyc", "**/node_modules/**", "**/.git/**"]

[tool.black]
line-length = 100
target-version = ['py311', 'py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | \.eggs
  | \.tox
  | build
  | dist
  | node_modules
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true

[tool.mypy]
python_version = "3.11"
# 缓存放树外，避免在仓库根堆出 .mypy_cache/（可被 MYPY_CACHE_DIR 覆盖）
cache_dir = "/tmp/hugagent-mypy-cache"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
# 缓存放树外，避免在仓库根堆出 .pytest_cache/
cache_dir = "/tmp/hugagent-pytest-cache"
testpaths = ["src/backend/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
# AgentScope 2.0 迁移后测试普遍为 async；auto 模式让 pytest-asyncio 自动处理
# `@pytest.mark.asyncio` 标记与裸 async def test，消除 strict 模式下的收集报错。
asyncio_mode = "auto"
markers = [
    "asyncio: mark test as async (handled by pytest-asyncio auto mode)",
    "postgres: integration test that requires TEST_POSTGRES_URL and validates PostgreSQL-specific behavior",
    # GCE 门禁类测试：跑得起但不属于快速内环，CI 全量跑。
    "slow: gate / benchmark tests excluded from the fast inner loop",
]

# Core boundary checks use the migration manifest to classify legacy locations.
[tool.importlinter]
root_packages = ["core", "api", "orchestration", "personal_agent", "edition_ee", "features", "integrations"]
contract_types = ["core-boundary: scripts.refactor.import_contract.CoreBoundaryContract"]

[[tool.importlinter.contracts]]
name = "Core boundaries and layer ratchet"
type = "core-boundary"
